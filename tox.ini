[tox]
envlist =
    flake8,
    py310-aiohttp{38,39,310,311,312},
    py311-aiohttp{39,310,311,312,313},
    py312-aiohttp{39,310,311,312,313},
    py313-aiohttp{310,311,312,313},
    py314-aiohttp313,
    coverage
no_package = true
skip_missing_interpreters = true

[testenv:flake8]
deps = flake8>=7.3.0
commands = flake8 aioresponses

[testenv]
setenv =
    PYTHONDONTWRITEBYTECODE=1
    PYTHONPATH = {toxinidir}:{toxinidir}/aioresponses
passenv = PYTEST_ADDOPTS
deps =
    -r{toxinidir}/requirements-dev.txt
    aiohttp38: aiohttp~=3.8.0
    aiohttp39: aiohttp~=3.9.0
    aiohttp310: aiohttp~=3.10.0
    aiohttp311: aiohttp~=3.11.0
    aiohttp312: aiohttp~=3.12.0
    aiohttp313: aiohttp~=3.13.0
commands =
    python -m pytest -q {posargs}

# Optional: if some very old aiohttp minors lag wheels for the freshest Python,
# you can skip a few combos explicitly (uncomment as needed).
# [testenv:py314-aiohttp38]
# skip_install = true
# commands = python -c "print('skipped: py314 + aiohttp 3.8')"

[testenv:coverage]
description = Run test suite with coverage (single best-supported combo)
base_python = python3.12
deps =
    -r{toxinidir}/requirements-dev.txt
    aiohttp~=3.13.0
commands =
    python -m pytest --cov=aioresponses --cov-report=term-missing {posargs}
