name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  python-major-version: 3

concurrency:
  group: ci-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  build:
    env:
      PYTEST_ADDOPTS: "--cov --cov-report=xml"

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-minor-version: [10, 11, 12, 13, 14]
        aiohttp-version: [aiohttp38, aiohttp39, aiohttp310, aiohttp311, aiohttp312, aiohttp313]
        exclude:
          # aiohttp 3.8 supports Python up to 3.10
          - aiohttp-version: aiohttp38
            python-minor-version: 11
          - aiohttp-version: aiohttp38
            python-minor-version: 12
          - aiohttp-version: aiohttp38
            python-minor-version: 13
          - aiohttp-version: aiohttp38
            python-minor-version: 14
          # aiohttp 3.9 supports Python up to 3.12
          - aiohttp-version: aiohttp39
            python-minor-version: 13
          - aiohttp-version: aiohttp39
            python-minor-version: 14
          # aiohttp 3.10-3.12 supports Python up to 3.13
          - aiohttp-version: aiohttp310
            python-minor-version: 14
          - aiohttp-version: aiohttp311
            python-minor-version: 14
          - aiohttp-version: aiohttp312
            python-minor-version: 14
          # aiohttp 3.13 supports Python 3.10-3.14 (no excludes)
          - aiohttp-version: aiohttp313
            python-minor-version: 10
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ env.python-major-version }}.${{ matrix.python-minor-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ env.python-major-version }}.${{ matrix.python-minor-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
    - name: Run Tests
      run: |
        tox -e py${{ env.python-major-version }}${{ matrix.python-minor-version }}-${{ matrix.aiohttp-version }}
    - uses: codecov/codecov-action@v2
      with:
        file: coverage.xml
