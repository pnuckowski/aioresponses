name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        aiohttp-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # aiohttp 3.8 supports Python up to 3.10
          - aiohttp-version: "3.8"
            python-version: "3.11"
          - aiohttp-version: "3.8"
            python-version: "3.12"
          - aiohttp-version: "3.8"
            python-version: "3.13"
          - aiohttp-version: "3.8"
            python-version: "3.14"
          # aiohttp 3.9 supports Python up to 3.12
          - aiohttp-version: "3.9"
            python-version: "3.13"
          - aiohttp-version: "3.9"
            python-version: "3.14"
          # aiohttp 3.10-3.12 supports Python up to 3.13
          - aiohttp-version: "3.10"
            python-version: "3.14"
          - aiohttp-version: "3.11"
            python-version: "3.14"
          - aiohttp-version: "3.12"
            python-version: "3.14"
          # aiohttp 3.13+ does not support Python 3.10
          - aiohttp-version: "3.13"
            python-version: "3.10"
          - aiohttp-version: "3.14"
            python-version: "3.10"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Override aiohttp version
        run: uv pip install "aiohttp~=${{ matrix.aiohttp-version }}.0"

      - name: Run tests
        run: uv run pytest --cov --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml